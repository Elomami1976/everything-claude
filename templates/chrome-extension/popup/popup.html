<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Name</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="../icons/icon48.png" alt="Logo" class="logo">
      <h1 class="title">Extension Name</h1>
    </header>

    <main class="main">
      <div class="toggle-row">
        <span class="label">Enabled</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-enabled">
          <span class="slider"></span>
        </label>
      </div>

      <button class="btn btn-primary" id="action-btn">
        Do Something
      </button>
    </main>

    <footer class="footer">
      <a href="#" id="settings-link">Settings</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
