<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <line x1="0" y1="50" x2="800" y2="50" stroke="#21262d" stroke-width="1"/>
  <line x1="0" y1="100" x2="800" y2="100" stroke="#21262d" stroke-width="1"/>
  <line x1="0" y1="150" x2="800" y2="150" stroke="#21262d" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="200" stroke="#21262d" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="200" stroke="#21262d" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#21262d" stroke-width="1"/>

  <!-- Border -->
  <rect width="800" height="200" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Brain icon (left) -->
  <g transform="translate(60, 100)" filter="url(#glow)">
    <!-- Brain outline simplified -->
    <ellipse cx="0" cy="-10" rx="28" ry="32" fill="none" stroke="url(#brainGrad)" stroke-width="2.5"/>
    <!-- Brain center line -->
    <line x1="0" y1="-38" x2="0" y2="22" stroke="url(#brainGrad)" stroke-width="1.5"/>
    <!-- Brain folds left -->
    <path d="M-28,-10 C-38,-20 -38,0 -28,10" fill="none" stroke="url(#brainGrad)" stroke-width="2"/>
    <path d="M-14,-28 C-24,-34 -26,-18 -18,-14" fill="none" stroke="url(#brainGrad)" stroke-width="1.5"/>
    <path d="M-14,8 C-24,14 -24,28 -14,22" fill="none" stroke="url(#brainGrad)" stroke-width="1.5"/>
    <!-- Brain folds right -->
    <path d="M28,-10 C38,-20 38,0 28,10" fill="none" stroke="url(#brainGrad)" stroke-width="2"/>
    <path d="M14,-28 C24,-34 26,-18 18,-14" fill="none" stroke="url(#brainGrad)" stroke-width="1.5"/>
    <path d="M14,8 C24,14 24,28 14,22" fill="none" stroke="url(#brainGrad)" stroke-width="1.5"/>
    <!-- Connector dots (neural) -->
    <circle cx="-20" cy="-18" r="2" fill="#a78bfa" opacity="0.8"/>
    <circle cx="20" cy="-18" r="2" fill="#60a5fa" opacity="0.8"/>
    <circle cx="-22" cy="6" r="2" fill="#a78bfa" opacity="0.8"/>
    <circle cx="22" cy="6" r="2" fill="#60a5fa" opacity="0.8"/>
    <circle cx="0" cy="22" r="2" fill="#34d399" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="126" y="88" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">everything-claude</text>

  <!-- Subtitle -->
  <text x="127" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#8b949e" letter-spacing="0.5">Agent Harness Performance Optimization Kit</text>

  <!-- Tag pills -->
  <!-- Claude Code -->
  <rect x="127" y="135" width="100" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="177" y="151" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Claude Code</text>

  <!-- Cursor -->
  <rect x="237" y="135" width="68" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="271" y="151" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">Cursor</text>

  <!-- OpenCode -->
  <rect x="315" y="135" width="84" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="357" y="151" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">OpenCode</text>

  <!-- Codex -->
  <rect x="409" y="135" width="64" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="441" y="151" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Codex</text>

  <!-- Right side stats -->
  <g transform="translate(700, 60)">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">SKILLS</text>
    <text x="0" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#a78bfa" text-anchor="middle" filter="url(#glow)">9</text>
  </g>
  <g transform="translate(700, 110)">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">COMMANDS</text>
    <text x="0" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#60a5fa" text-anchor="middle" filter="url(#glow)">6</text>
  </g>
  <g transform="translate(700, 160)">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">AGENTS</text>
    <text x="0" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#34d399" text-anchor="middle" filter="url(#glow)">3</text>
  </g>

  <!-- Vertical divider before stats -->
  <line x1="655" y1="20" x2="655" y2="180" stroke="#30363d" stroke-width="1"/>
</svg>
